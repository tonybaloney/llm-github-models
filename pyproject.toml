[project]
name = "llm-github-models"
version = "0.18.0"
description = "LLM plugin to access GitHub Models API"
readme = "README.md"
authors = [{name = "Anthony Shaw"}]
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License"
]
dependencies = [
    "aiohttp>=3.11.18",
    "llm>=0.26",
    "azure-ai-inference>=1.0.0b8",
]

[project.urls]
Homepage = "https://github.com/tonybaloney/llm-github-models"
Changelog = "https://github.com/tonybaloney/llm-github-models/releases"
Issues = "https://github.com/tonybaloney/llm-github-models/issues"
CI = "https://github.com/tonybaloney/llm-github-models/actions"

[project.entry-points.llm]
github = "llm_github_models"
azure = "llm_azure"

[project.optional-dependencies]
azure = ["azure-ai-projects", "azure-identity"]
test = ["pytest", "pytest-recording", "pytest-asyncio", "ruff", "pyright"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

# Explicitly include both top-level packages to fix flat-layout discovery
[tool.setuptools]
packages = ["llm_github_models", "llm_azure"]

# Define the build system for PEP 517 builds
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
